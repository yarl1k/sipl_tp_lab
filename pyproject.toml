[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-language-toolkit"
version = "0.1.0"
description = "A small parser, interpreter, trace and visualisation toolkit for SIPL university project"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Repository = "https://github.com/yarl1k/sipl_tp_lab"

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["sipl"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true